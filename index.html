<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Flashcards</title>
		<link rel="stylesheet" href="css/style.css" type="text/css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400;1,700&family=Xmind:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

	</head>
	<body onload="getRandomword()">
		<h1 class="title">Flashcards</h1>

		<div class="question">
			<h3>Question</h3>
		</div>

		<div class="answer">
			<h3>Answer</h3>

		</div>
		
		<div class="button">
			<button class="check">Check answer</button>
			<button class="next">Next answer</button>
		</div>
		<script src="js/app.js"></script>
	</body>
</html>
